<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Company Dashboard</title>

        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
        />

        <style>
            .sidebar {
                min-height: 100vh;
                background: #212529;
                color: white;
            }
            .sidebar .nav-link {
                color: #adb5bd;
            }
            .sidebar .nav-link.active {
                color: white;
                background: #343a40;
            }
            .btn-cyan {
                background-color: #0dcaf0;
                color: white;
                border: none;
            }
            .btn-cyan:hover {
                background-color: #0baccc;
                color: white;
            }
            .loading-spinner {
                display: none;
            }
        </style>
    </head>
    <body>
        <div class="container-fluid">
            <div class="row">
                <nav class="col-md-3 col-lg-2 d-md-block sidebar p-3 shadow-sm">
                    <div class="text-center mb-4">
                        <h5 class="mt-2 fw-bold">Company Portal</h5>
                    </div>
                    <ul class="nav d-flex flex-column gap-2">
                        <li class="nav-item">
                            <a
                                class="nav-link active"
                                id="activeDrivesNav"
                                href="#"
                                onclick="fetchDrives('active')"
                            >
                                <i class="bi bi-briefcase me-2"></i> Active
                                Drives
                            </a>
                        </li>
                        <li class="nav-item">
                            <a
                                class="nav-link"
                                id="closedDrivesNav"
                                href="#"
                                onclick="fetchDrives('closed')"
                            >
                                <i class="bi bi-archive me-2"></i> Closed Drives
                            </a>
                        </li>
                        <li class="nav-item">
                            <hr />
                            <a
                                href="#"
                                class="nav-link text-danger fw-bold"
                                onclick="handleLogout()"
                            >
                                <i class="bi bi-box-arrow-right me-2"></i>
                                Logout
                            </a>
                        </li>
                    </ul>
                </nav>

                <main
                    class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4 bg-light"
                >
                    <div
                        class="d-flex justify-content-between align-items-center mb-4"
                    >
                        <div>
                            <h1 class="h3 fw-bold" id="pageTitle">
                                Active Placement Drives
                            </h1>
                            <div
                                id="loader"
                                class="spinner-border spinner-border-sm text-info loading-spinner"
                            ></div>
                        </div>
                        <button
                            class="btn btn-cyan px-4 fw-bold shadow-sm"
                            data-bs-toggle="modal"
                            data-bs-target="#createDriveModal"
                        >
                            <i class="bi bi-plus-lg me-2"></i>Create New Drive
                        </button>
                    </div>

                    <div
                        class="card border-0 shadow-sm"
                        style="border-radius: 12px"
                    >
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr id="tableHeader"></tr>
                                </thead>
                                <tbody id="tableBody"></tbody>
                            </table>
                        </div>
                    </div>
                </main>
            </div>
        </div>

        <div
            class="modal fade"
            id="detailModal"
            tabindex="-1"
            aria-hidden="true"
        >
            <div class="modal-dialog modal-xl">
                <div class="modal-content border-0 shadow">
                    <div class="modal-header bg-light">
                        <h5 class="modal-title fw-bold" id="detailModalLabel">
                            Review Applications
                        </h5>
                        <button
                            type="button"
                            class="btn-close"
                            data-bs-dismiss="modal"
                        ></button>
                    </div>
                    <div class="modal-body" id="modalBody"></div>
                </div>
            </div>
        </div>

        <div
            class="modal fade"
            id="createDriveModal"
            tabindex="-1"
            aria-labelledby="createDriveModalLabel"
            aria-hidden="true"
        >
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5
                            class="modal-title fw-bold"
                            id="createDriveModalLabel"
                        >
                            Create New Placement Drive
                        </h5>
                        <button
                            type="button"
                            class="btn-close"
                            data-bs-dismiss="modal"
                            aria-label="Close"
                        ></button>
                    </div>
                    <form id="createDriveForm">
                        <div class="modal-body">
                            <div class="mb-3">
                                <label class="form-label"
                                    >Drive Name / Title</label
                                >
                                <input
                                    type="text"
                                    class="form-control"
                                    name="title"
                                    required
                                    placeholder="e.g. Summer Internship 2026"
                                />
                            </div>
                            <div class="mb-3">
                                <label class="form-label"
                                    >Job Description</label
                                >
                                <textarea
                                    class="form-control"
                                    name="description"
                                    rows="3"
                                    required
                                ></textarea>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Requirements</label>
                                <input
                                    type="text"
                                    class="form-control"
                                    name="requirements"
                                    placeholder="e.g. Python, SQL, 7.0+ CGPA"
                                />
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button
                                type="button"
                                class="btn btn-secondary"
                                data-bs-dismiss="modal"
                            >
                                Cancel
                            </button>
                            <button
                                type="submit"
                                class="btn btn-cyan text-white"
                            >
                                Save Drive
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <script src="{{url_for('static', filename='js/company.js')}}"></script>
    </body>
</html>
