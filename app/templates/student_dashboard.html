<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Admin Dashboard</title>

        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
        />
        <style>
            .sidebar {
                min-height: 100vh;
                background: #212529;
                color: white;
            }
            .sidebar .nav-link {
                color: #adb5bd;
            }
            .sidebar .nav-link.active {
                color: white;
                background: #343a40;
            }
            .loading-spinner {
                display: none;
            }
        </style>
    </head>
    <body>
        <div class="container-fluid">
            <div class="row">
                <nav class="col-md-3 col-lg-2 d-md-block sidebar p-3">
                    <h4 class="mb-4">Admin Panel</h4>
                    <ul class="nav d-flex flex-column">
                        <li class="nav-item">
                            <a
                                class="nav-link active"
                                id="companyNav"
                                href="#"
                                onclick="fetchData('companies')"
                                ><i class="bi bi-building me-2"></i>
                                Companies</a
                            >
                        </li>
                        <li class="nav-item">
                            <a
                                class="nav-link"
                                id="studentNav"
                                href="#"
                                onclick="fetchData('students')"
                                ><i class="bi bi-people me-2"></i> Students</a
                            >
                        </li>
                        <li class="nav-item">
                            <a
                                class="nav-link"
                                id="drivesNav"
                                href="#"
                                onclick="fetchData('drives')"
                                ><i class="bi bi-megaphone me-2"></i> Drive
                                Approvals</a
                            >
                        </li>

                        <li class="nav-item">
                            <hr class="text-secondary" />
                            <a
                                href="#"
                                class="nav-link text-danger fw-bold"
                                onclick="handleLogout()"
                            >
                                <i class="bi bi-box-arrow-right me-2"></i>
                                Logout
                            </a>
                        </li>
                    </ul>
                </nav>

                <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
                    <div
                        class="d-flex justify-content-between align-items-center border-bottom pb-2 mb-3"
                    >
                        <h1 class="h2" id="pageTitle"></h1>
                        <div
                            id="loader"
                            class="spinner-border spinner-border-sm text-primary loading-spinner"
                        ></div>
                    </div>

                    <div class="card shadow-sm">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead
                                    class="table-light"
                                    id="tableHeader"
                                ></thead>
                                <tbody id="tableBody"></tbody>
                            </table>
                        </div>
                    </div>
                </main>
            </div>
        </div>

        <div
            class="modal fade"
            id="detailModal"
            tabindex="-1"
            aria-labelledby="detailModalLabel"
            aria-hidden="true"
        >
            <div class="modal-dialog modal-lg">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="detailModalLabel">
                            Details
                        </h5>
                        <button
                            type="button"
                            class="btn-close"
                            data-bs-dismiss="modal"
                            aria-label="Close"
                        ></button>
                    </div>
                    <div class="modal-body" id="modalBody"></div>
                    <div class="modal-footer">
                        <button
                            type="button"
                            class="btn btn-secondary"
                            data-bs-dismiss="modal"
                        >
                            Close
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <script src="{{url_for('static', filename='js/admin.js')}}"></script>
    </body>
</html>
