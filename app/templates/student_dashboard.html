<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Student Dashboard</title>

        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
        />

        <style>
            .sidebar {
                min-height: 100vh;
                background: #212529;
                color: white;
            }
            .sidebar .nav-link {
                color: #adb5bd;
            }
            .sidebar .nav-link.active {
                color: white;
                background: #343a40;
            }
            .btn-cyan {
                background-color: #0dcaf0;
                color: white;
                border: none;
            }
            .btn-cyan:hover {
                background-color: #0baccc;
                color: white;
            }
            .loading-spinner {
                display: none;
            }
            .card-drive:hover {
                transform: translateY(-5px);
                transition: 0.3s;
            }
        </style>
    </head>
    <body>
        <div class="container-fluid">
            <div class="row">
                <nav class="col-md-3 col-lg-2 d-md-block sidebar p-3 shadow-sm">
                    <div class="text-center mb-4">
                        <i
                            class="bi bi-mortarboard-fill text-info display-6"
                        ></i>
                        <h5 class="mt-2 fw-bold">Student Portal</h5>
                    </div>
                    <ul class="nav d-flex flex-column gap-2">
                        <li class="nav-item">
                            <a
                                class="nav-link active"
                                id="drivesNav"
                                href="#"
                                onclick="fetchAvailableDrives()"
                            >
                                <i class="bi bi-megaphone me-2"></i> Active
                                Drives
                            </a>
                        </li>
                        <li class="nav-item">
                            <a
                                class="nav-link"
                                id="historyNav"
                                href="#"
                                onclick="fetchHistory()"
                            >
                                <i class="bi bi-clock-history me-2"></i> My
                                Applications
                            </a>
                        </li>
                        <li class="nav-item">
                            <hr />
                            <a
                                href="#"
                                class="nav-link text-danger fw-bold"
                                onclick="handleLogout()"
                            >
                                <i class="bi bi-box-arrow-right me-2"></i>
                                Logout
                            </a>
                        </li>
                    </ul>
                </nav>

                <main
                    class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4 bg-light"
                >
                    <div
                        class="d-flex justify-content-between align-items-center mb-4"
                    >
                        <h1 class="h3 fw-bold" id="pageTitle">
                            Active Placement Drives
                        </h1>
                        <div
                            id="loader"
                            class="spinner-border spinner-border-sm text-info loading-spinner"
                        ></div>
                    </div>

                    <div id="dynamicContent" class="row g-4"></div>
                </main>
            </div>
        </div>

        <div
            class="modal fade"
            id="detailModal"
            tabindex="-1"
            aria-hidden="true"
        >
            <div class="modal-dialog">
                <div class="modal-content border-0 shadow">
                    <div class="modal-header">
                        <h5 class="modal-title fw-bold" id="detailModalLabel">
                            Drive Details
                        </h5>
                    </div>
                    <div class="modal-body" id="modalBody"></div>
                    <div class="modal-footer d-block">
                        <div id="uploadSection" class="mb-3 d-none">
                            <label
                                class="form-label small fw-bold text-secondary"
                                >UPLOAD RESUME (PDF ONLY)</label
                            >
                            <input
                                type="file"
                                id="resumeFile"
                                class="form-control form-control-sm"
                                accept=".pdf"
                            />
                        </div>
                        <div class="d-flex justify-content-end gap-2">
                            <button
                                class="btn btn-secondary"
                                data-bs-dismiss="modal"
                            >
                                Close
                            </button>
                            <button
                                id="mainActionBtn"
                                class="btn btn-cyan text-white px-4"
                                onclick="prepareUpload()"
                            >
                                Apply Now
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script src="{{url_for('static', filename='js/student.js')}}"></script>
    </body>
</html>
